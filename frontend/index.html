<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple API Pool 控制台</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=IBM+Plex+Sans+SC:wght@400;500;600&display=swap");

    :root {
      --bg: #f3ede1;
      --bg-grad-top-left: rgba(181, 82, 51, 0.16);
      --bg-grad-top-right: rgba(46, 85, 70, 0.12);
      --bg-grad-from: #faf3e6;
      --bg-grad-to: #ede4d4;
      --panel: rgba(255, 251, 243, 0.92);
      --panel-strong: #fffaf0;
      --panel-soft: rgba(252, 246, 234, 0.6);
      --panel-input: rgba(255, 252, 247, 0.95);
      --panel-input-readonly: rgba(245, 238, 226, 0.7);
      --panel-key: rgba(245, 238, 226, 0.7);
      --line: rgba(52, 44, 31, 0.12);
      --line-soft: rgba(52, 44, 31, 0.06);
      --text: #2a241a;
      --muted: #6a5f4d;
      --muted-strong: #4d4434;
      --accent: #b55233;
      --accent-deep: #7e2a14;
      --accent-text: #fff8ef;
      --accent-soft: rgba(181, 82, 51, 0.12);
      --accent-soft-2: rgba(181, 82, 51, 0.06);
      --ok: #1f6a3f;
      --ok-bg: rgba(31, 106, 63, 0.08);
      --ok-line: rgba(31, 106, 63, 0.22);
      --warn: #9a6626;
      --err: #8a2f22;
      --err-bg: rgba(138, 47, 34, 0.08);
      --err-line: rgba(138, 47, 34, 0.22);
      --grid-line: rgba(53, 40, 22, 0.025);
      --grid-mask-end: rgba(0, 0, 0, 0.55);
      --shadow-lg: 0 18px 44px rgba(80, 53, 18, 0.12);
      --shadow-sm: 0 6px 16px rgba(80, 53, 18, 0.08);
      --shadow-card-hover: 0 10px 24px rgba(80, 53, 18, 0.08);
      --shadow-btn: 0 10px 22px rgba(126, 42, 20, 0.18);
      --shadow-btn-hover: 0 14px 28px rgba(126, 42, 20, 0.24);
      --shadow-nav-active: 0 8px 18px rgba(126, 42, 20, 0.22);
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 14px;
    }

    [data-theme="dark"] {
      --bg: #1a1611;
      --bg-grad-top-left: rgba(217, 121, 78, 0.18);
      --bg-grad-top-right: rgba(82, 138, 116, 0.14);
      --bg-grad-from: #1f1a13;
      --bg-grad-to: #14110c;
      --panel: rgba(36, 30, 22, 0.85);
      --panel-strong: rgba(42, 35, 25, 0.95);
      --panel-soft: rgba(36, 30, 22, 0.5);
      --panel-input: rgba(28, 23, 17, 0.9);
      --panel-input-readonly: rgba(22, 18, 13, 0.7);
      --panel-key: rgba(28, 23, 17, 0.7);
      --line: rgba(232, 215, 184, 0.12);
      --line-soft: rgba(232, 215, 184, 0.06);
      --text: #ece1cc;
      --muted: #a89a82;
      --muted-strong: #c4b89e;
      --accent: #d9794e;
      --accent-deep: #e89270;
      --accent-text: #1a1611;
      --accent-soft: rgba(217, 121, 78, 0.18);
      --accent-soft-2: rgba(217, 121, 78, 0.08);
      --ok: #6ec48c;
      --ok-bg: rgba(110, 196, 140, 0.12);
      --ok-line: rgba(110, 196, 140, 0.28);
      --warn: #d4a456;
      --err: #e07c6c;
      --err-bg: rgba(224, 124, 108, 0.12);
      --err-line: rgba(224, 124, 108, 0.28);
      --grid-line: rgba(232, 215, 184, 0.04);
      --grid-mask-end: rgba(0, 0, 0, 0.7);
      --shadow-lg: 0 18px 44px rgba(0, 0, 0, 0.4);
      --shadow-sm: 0 6px 16px rgba(0, 0, 0, 0.28);
      --shadow-card-hover: 0 10px 24px rgba(0, 0, 0, 0.32);
      --shadow-btn: 0 10px 22px rgba(217, 121, 78, 0.24);
      --shadow-btn-hover: 0 14px 28px rgba(217, 121, 78, 0.32);
      --shadow-nav-active: 0 8px 18px rgba(217, 121, 78, 0.28);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--text);
      font-family: "IBM Plex Sans SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, var(--bg-grad-top-left), transparent 26%),
        radial-gradient(circle at top right, var(--bg-grad-top-right), transparent 22%),
        linear-gradient(180deg, var(--bg-grad-from) 0%, var(--bg) 42%, var(--bg-grad-to) 100%);
      transition: background 0.3s ease, color 0.3s ease;
    }

    body[data-lang="en"] {
      font-family: "Inter", "IBM Plex Sans", system-ui, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(180deg, var(--grid-mask-end), transparent 92%);
    }

    .shell {
      width: min(1200px, calc(100vw - 32px));
      margin: 28px auto 56px;
      position: relative;
      z-index: 1;
    }

    /* Hero */
    .hero {
      padding: 24px 28px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255, 251, 243, 0.96), rgba(249, 239, 220, 0.84));
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -64px;
      top: -64px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-soft), transparent 68%);
      pointer-events: none;
    }

    .hero-top {
      display: flex;
      gap: 18px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .nav button {
      border: none;
      border-radius: 999px;
      padding: 9px 18px;
      font: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      color: var(--muted-strong);
      background: transparent;
      transition: color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .nav button:hover { color: var(--accent-deep); }

    .nav button.active {
      color: var(--accent-text);
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      box-shadow: var(--shadow-nav-active);
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--muted-strong);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease, transform 0.18s ease;
      padding: 0;
    }

    .icon-btn:hover {
      color: var(--accent-deep);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .icon-btn svg { width: 18px; height: 18px; }

    .lang-btn {
      width: auto;
      padding: 0 12px;
      gap: 6px;
      letter-spacing: 0.04em;
    }

    .theme-icon-sun { display: none; }
    [data-theme="dark"] .theme-icon-sun { display: inline; }
    [data-theme="dark"] .theme-icon-moon { display: none; }

    .brand .eyebrow {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-deep);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .brand h1 {
      margin: 0;
      font-family: "Noto Serif SC", serif;
      font-size: clamp(26px, 3.4vw, 38px);
      line-height: 1.1;
    }

    .brand p {
      max-width: 640px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin: 8px 0 0;
    }

    /* Buttons */
    button.primary,
    .button-link.primary {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      color: var(--accent-text);
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      box-shadow: var(--shadow-btn);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    button.secondary,
    .button-link.secondary {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 16px;
      font: inherit;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      color: var(--accent-deep);
      background: var(--panel);
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    button.primary:hover,
    button.secondary:hover {
      transform: translateY(-1px);
    }

    button.primary:hover { box-shadow: var(--shadow-btn-hover); }
    button.secondary:hover { background: var(--panel-strong); border-color: var(--accent); }

    /* Grids */
    .grid { display: grid; gap: 18px; }

    .summary-grid {
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      margin-top: 22px;
    }

    .content-grid {
      grid-template-columns: 1.1fr 0.9fr;
      align-items: start;
      margin-top: 20px;
    }

    /* Panels */
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(8px);
    }

    .panel-header {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .panel h2,
    .panel h3 {
      margin: 0;
      font-family: "Noto Serif SC", serif;
      font-weight: 700;
    }

    .panel h2 { font-size: 20px; }
    .panel h3 { font-size: 17px; }

    .panel-subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      margin: 4px 0 16px;
    }

    .panel-section + .panel-section { margin-top: 20px; }
    .panel-section h3 { margin-bottom: 10px; }

    .divider {
      height: 1px;
      background: var(--line-soft);
      margin: 18px 0;
      border: 0;
    }

    /* Metrics */
    .metric {
      position: relative;
      overflow: hidden;
      padding: 18px 20px;
    }

    .metric::before {
      content: "";
      position: absolute;
      inset: auto -36px -36px auto;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-soft), transparent 66%);
      pointer-events: none;
    }

    .metric-label {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .metric-value {
      font-size: clamp(26px, 3.6vw, 36px);
      font-weight: 700;
      line-height: 1.1;
      font-family: "Noto Serif SC", serif;
    }

    .metric-note {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.5;
    }

    /* Status badges */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .status-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-badge.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-line); }
    .status-badge.err { color: var(--err); background: var(--err-bg); border-color: var(--err-line); }

    /* Lists */
    .list { display: grid; gap: 14px; }

    .provider-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 18px;
      background: var(--panel-strong);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .provider-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-card-hover);
    }

    .provider-card.subtle {
      background: var(--panel-soft);
      border-style: dashed;
    }

    .provider-head {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .provider-name {
      font-family: "Noto Serif SC", serif;
      font-size: 22px;
      margin: 0;
      line-height: 1.2;
    }

    .provider-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
      line-height: 1.6;
    }

    .tag-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .tag {
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-deep);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .tag.muted { background: var(--accent-soft-2); color: var(--muted-strong); }
    .tag.ok { background: var(--ok-bg); color: var(--ok); }
    .tag.err { background: var(--err-bg); color: var(--err); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .mini {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--panel-input);
      border: 1px solid var(--line-soft);
    }

    .mini strong {
      display: block;
      font-size: 20px;
      margin-bottom: 4px;
      font-family: "Noto Serif SC", serif;
    }

    .mini span {
      font-size: 11.5px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* Forms */
    form { display: grid; gap: 14px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    label {
      display: grid;
      gap: 6px;
      font-size: 12.5px;
      color: var(--muted-strong);
      font-weight: 500;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--panel-input);
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      min-height: 42px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
      line-height: 1.6;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    input[readonly] {
      background: var(--panel-input-readonly);
      color: var(--muted-strong);
      cursor: default;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--panel-input);
      color: var(--text);
      font-weight: 500;
      cursor: pointer;
      min-height: 42px;
    }

    .checkbox input {
      width: 16px;
      height: 16px;
      min-height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .inline-status {
      min-height: 20px;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .inline-status.error { color: var(--err); }
    .inline-status.ok { color: var(--ok); }
    .error-type-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    /* Key list */
    .key-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .key-item {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: var(--panel-key);
      border: 1px solid var(--line-soft);
    }

    .key-item code {
      display: block;
      overflow-wrap: anywhere;
      color: var(--accent-deep);
      font-size: 13px;
      font-family: "JetBrains Mono", "Consolas", monospace;
    }

    /* Empty state */
    .empty {
      padding: 18px;
      border-radius: var(--radius-md);
      background: var(--panel-soft);
      color: var(--muted);
      border: 1px dashed var(--line);
      text-align: center;
      font-size: 13px;
    }

    /* Legend */
    .legend-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .legend-item {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--panel-input);
      border: 1px solid var(--line-soft);
    }

    .legend-item strong {
      display: block;
      font-size: 13px;
      color: var(--accent-deep);
      margin-bottom: 2px;
      font-weight: 600;
    }

    .legend-item span {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Hint card */
    .hint {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft-2);
      border-left: 3px solid var(--accent);
      font-size: 13px;
      color: var(--muted-strong);
      line-height: 1.7;
    }

    .hint code {
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent-deep);
      font-family: "JetBrains Mono", "Consolas", monospace;
      font-size: 12.5px;
    }

    .hidden { display: none !important; }

    /* Responsive */
    @media (max-width: 960px) {
      .content-grid { grid-template-columns: 1fr; }
      .legend-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      .shell {
        width: min(100vw - 18px, 100%);
        margin-top: 12px;
      }

      .hero, .panel { padding: 16px; border-radius: 22px; }

      .hero-top { flex-direction: column; align-items: stretch; }

      .hero-actions { justify-content: space-between; }

      .nav { flex: 1; }
      .nav button { flex: 1; }

      .form-grid, .form-grid.three { grid-template-columns: 1fr; }

      .provider-head { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="hero-top">
        <div class="brand">
          <div class="eyebrow">Simple API Pool</div>
          <h1 id="hero-title" data-i18n="hero.statusTitle">运行总览</h1>
          <p id="hero-copy" data-i18n="hero.statusCopy">实时查看各提供商的请求与 Token 用量。</p>
        </div>
        <div class="hero-actions">
          <div class="nav">
            <button id="nav-status" type="button" data-i18n="nav.status">状态页</button>
            <button id="nav-admin" type="button" data-i18n="nav.admin">管理页</button>
          </div>
          <button id="lang-toggle" class="icon-btn lang-btn" type="button" title="Language" aria-label="Language">
            <span id="lang-toggle-label">中</span>
          </button>
          <button id="theme-toggle" class="icon-btn" type="button" title="Theme" aria-label="Theme">
            <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </button>
        </div>
      </div>
      <div class="grid summary-grid" id="summary-grid">
        <article class="panel metric">
          <div class="metric-label" data-i18n="metric.health">服务状态</div>
          <div class="metric-value" id="service-health" data-i18n="metric.healthChecking">检测中</div>
          <div class="metric-note" id="service-health-note" data-i18n="metric.healthCheckingNote">正在检测后端健康接口</div>
        </article>
        <article class="panel metric">
          <div class="metric-label" data-i18n="metric.providers">提供商</div>
          <div class="metric-value" id="provider-count">0</div>
          <div class="metric-note" data-i18n="metric.providersNote">已统计的提供商数量</div>
        </article>
        <article class="panel metric">
          <div class="metric-label" data-i18n="metric.success">成功请求</div>
          <div class="metric-value" id="success-total">0</div>
          <div class="metric-note" data-i18n="metric.cumulative">所有提供商累计</div>
        </article>
        <article class="panel metric">
          <div class="metric-label" data-i18n="metric.error">错误请求</div>

    function detectInitialLang() {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved && messages[saved]) return saved;
      const nav = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
      return nav.toLowerCase().startsWith("zh") ? "zh-CN" : "en";
    }

    function detectInitialTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === "light" || saved === "dark") return saved;
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    const state = {
      adminKey: localStorage.getItem(STORAGE_KEY) || "",
      providers: [],
      stats: {},
      lang: detectInitialLang(),
      theme: detectInitialTheme(),
      themeManual: localStorage.getItem(THEME_KEY) !== null
    };

    function t(key, params) {
      const dict = messages[state.lang] || messages["en"];
      let value = dict[key];
      if (value === undefined) {
        value = (messages["en"][key] !== undefined) ? messages["en"][key] : key;
      }
      if (params) {
        for (const [k, v] of Object.entries(params)) {
          value = value.replaceAll(`{${k}}`, String(v));
        }
      }
      return value;
    }

    function applyI18nStatic() {
      document.documentElement.lang = state.lang === "en" ? "en" : "zh-CN";
      document.body.dataset.lang = state.lang === "en" ? "en" : "zh";
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        const text = t(key);
        if (el.tagName === "LABEL") {
          // Replace the first non-empty text node so nested <input> stays intact
          for (const node of el.childNodes) {
            if (node.nodeType === Node.TEXT_NODE && node.nodeValue.trim()) {
              node.nodeValue = "\n              " + text + "\n              ";
              return;
            }
          }
          // No existing text node — prepend one before the first input
          const txt = document.createTextNode("\n              " + text + "\n              ");
          el.insertBefore(txt, el.firstChild);
        } else if (el.children.length === 0) {
          el.textContent = text;
        }
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
        el.placeholder = t(el.getAttribute("data-i18n-placeholder"));
      });
      document.querySelectorAll("[data-i18n-html]").forEach((el) => {
        el.innerHTML = t(el.getAttribute("data-i18n-html"));
      });
      const langLabel = document.getElementById("lang-toggle-label");
      if (langLabel) langLabel.textContent = t("label.lang");
    }

    function applyTheme() {
      document.documentElement.dataset.theme = state.theme;
    }

    function setTheme(theme) {
      state.theme = theme;
      state.themeManual = true;
      localStorage.setItem(THEME_KEY, theme);
      applyTheme();
    }

    function setLang(lang) {
      state.lang = messages[lang] ? lang : "en";
      localStorage.setItem(LANG_KEY, state.lang);
      applyI18nStatic();
      // Re-render dynamic content
      setRouteView();
      renderStatusCards(state.stats);
      if (state.providers && state.providers.length) {
        renderProviders(state.providers);
      }
    }

      const onStatus = route !== "admin";
      refs.statusView.classList.toggle("hidden", !onStatus);
      refs.adminView.classList.toggle("hidden", onStatus);
      refs.navStatus.classList.toggle("active", onStatus);
      refs.navAdmin.classList.toggle("active", !onStatus);
      refs.heroTitle.textContent = t(onStatus ? "hero.statusTitle" : "hero.adminTitle");
      refs.heroCopy.textContent = t(onStatus ? "hero.statusCopy" : "hero.adminCopy");
    }

    function goTo(path) {
      window.location.href = path;
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function setMessage(element, text, kind = "") {
      element.textContent = text || "";
      element.className = "inline-status";
      if (kind) {
        element.classList.add(kind);
      }
    }

    function setStoredAdminKey(key) {
      state.adminKey = key;
      if (key) {
        localStorage.setItem(STORAGE_KEY, key);
      } else {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function formatTimestamp(value) {
      if (!value) {
        return t("provider.notDisabled");
      }
      const date = new Date(Number(value) * 1000);
      if (Number.isNaN(date.getTime())) {
        return String(value);
      }
      const locale = state.lang === "en" ? "en-US" : "zh-CN";
      return date.toLocaleString(locale, { hour12: false });
    }

    function summarizeProviderKeys(keys) {
      const now = Date.now();
      let available = 0;
      let disabled = 0;
      for (const key of keys) {
        const disabledUntilMs = Number(key.disabled_until || 0) * 1000;
        if (disabledUntilMs > now) {
          disabled += 1;
          continue;
        }
        available += 1;
      }
      return { available, disabled };
    }

    async function parseErrorMessage(response, fallback) {
      try {
        const data = await response.json();
        return data.error || fallback;
      } catch {
        return fallback;
      }
    }

    async function request(path, options = {}, requireAdmin = false) {
      const headers = new Headers(options.headers || {});
      if (!headers.has("Content-Type") && options.body && typeof options.body === "string") {
        headers.set("Content-Type", "application/json");
      }
      if (requireAdmin && state.adminKey) {
        headers.set("Authorization", `Bearer ${state.adminKey}`);
      }
      return fetch(`${API_BASE}${path}`, { ...options, headers });
    }

    async function loadHealth() {
      try {
        const response = await request("/health");
        if (!response.ok) {
          throw new Error(t("error.healthAbnormal"));
        }
        const data = await response.json();
        refs.serviceHealth.textContent = t("metric.healthOnline");
        refs.serviceHealthNote.textContent = t("metric.healthNote", { status: data.status || "ok" });
        refs.statusBadge.textContent = t("status.updated");
        refs.statusBadge.className = "status-badge ok";
      } catch (error) {
        refs.serviceHealth.textContent = t("metric.healthError");
        refs.serviceHealthNote.textContent = error.message || t("metric.healthUnavailable");
        refs.statusBadge.textContent = t("status.failed");
        refs.statusBadge.className = "status-badge err";
      }
    }

    function renderStatusCards(statsMap) {
      const entries = Object.entries(statsMap || {});
      state.stats = statsMap || {};
      refs.providerCount.textContent = String(entries.length);

      const totalSuccess = entries.reduce((sum, [, item]) => sum + (item.success_count || 0), 0);
      const totalError = entries.reduce((sum, [, item]) => sum + (item.error_count || 0), 0);
      refs.successTotal.textContent = String(totalSuccess);
      refs.errorTotal.textContent = String(totalError);

      if (!entries.length) {
        refs.statusList.innerHTML = `<div class="empty">${escapeHTML(t("status.empty"))}</div>`;
        return;
      }

      refs.statusList.innerHTML = entries.map(([name, item]) => {
        const success = item.success_count || 0;
        const error = item.error_count || 0;
        const total = success + error;
        const successRate = total ? `${((success / total) * 100).toFixed(1)}%` : t("provider.rateNone");
        const errorRate = total ? `${((error / total) * 100).toFixed(1)}%` : t("provider.rateNone");
        const availableKeys = item.available_keys || 0;
        const totalKeys = item.total_keys || 0;
        const errorTypes = Object.entries(item.error_types || {}).filter(([, count]) => Number(count) > 0);
        const errorTypeMarkup = errorTypes.length
          ? `
            <div class="error-type-row">
              <span class="tag muted">${escapeHTML(t("provider.errorTypeTitle"))}</span>
              ${errorTypes.map(([code, count]) => `<span class="tag err">${escapeHTML(`${code} × ${count}`)}</span>`).join("")}
            </div>
          `
          : "";

        return `
          <article class="provider-card">
            <div class="provider-head">
              <div>
                <h3 class="provider-name">${escapeHTML(name)}</h3>
                <div class="tag-row">
                  <span class="tag ok">${escapeHTML(t("provider.tagSuccessRate", { n: successRate }))}</span>
                  <span class="tag err">${escapeHTML(t("provider.tagErrorRate", { n: errorRate }))}</span>
                  <span class="tag muted">${escapeHTML(t("provider.tagCacheHits", { n: item.cache_hits || 0 }))}</span>
                  <span class="tag">${escapeHTML(t("provider.tagAvailableKeys", { available: availableKeys, total: totalKeys }))}</span>
                </div>
              </div>
            </div>
            <div class="stats-grid">
              <div class="mini"><strong>${success}</strong><span>${escapeHTML(t("provider.statSuccess"))}</span></div>
              <div class="mini"><strong>${error}</strong><span>${escapeHTML(t("provider.statError"))}</span></div>
              <div class="mini"><strong>${item.input_tokens || 0}</strong><span>${escapeHTML(t("provider.statInputTokens"))}</span></div>
              <div class="mini"><strong>${item.output_tokens || 0}</strong><span>${escapeHTML(t("provider.statOutputTokens"))}</span></div>
              <div class="mini"><strong>${item.cache_tokens || 0}</strong><span>${escapeHTML(t("provider.statCacheTokens"))}</span></div>
              <div class="mini"><strong>${item.cache_hits || 0}</strong><span>${escapeHTML(t("provider.statCacheHits"))}</span></div>
            </div>
            ${errorTypeMarkup}
          </article>
        `;
      }).join("");
    }

    async function loadStatus() {
      try {
        const response = await request("/status/stats");
        if (!response.ok) {
          throw new Error(await parseErrorMessage(response, t("error.readStatus")));
        }
        const data = await response.json();
        renderStatusCards(data);
      } catch (error) {
        refs.statusList.innerHTML = `<div class="empty">${escapeHTML(error.message || t("error.readStatus"))}</div>`;
        refs.statusBadge.textContent = t("status.failed");
        refs.statusBadge.className = "status-badge err";
      }
    }

    function startStatusPolling() {
      if (statusPollTimer !== null) {
        clearInterval(statusPollTimer);
      }
      statusPollTimer = setInterval(() => {
        if (document.visibilityState === "hidden") {
          return;
        }
        void loadStatus();
      }, STATUS_POLL_INTERVAL_MS);
    }

    async function loginAdmin(adminKey) {
      const response = await request("/admin/login", {
        method: "POST",
        body: JSON.stringify({ admin_key: adminKey })
      });
      if (!response.ok) {
        throw new Error(await parseErrorMessage(response, t("error.login")));
      }
      setStoredAdminKey(adminKey);
      refs.loginKey.value = adminKey;
      refs.logoutButton.classList.remove("hidden");
      setMessage(refs.loginStatus, t("admin.loginSuccess"), "ok");
    }

    async function loadAdminData() {
      if (!state.adminKey) {
        refs.adminWorkspace.classList.add("hidden");
        refs.logoutButton.classList.add("hidden");
        refs.providerList.innerHTML = `<div class="empty">${escapeHTML(t("admin.pleaseLogin"))}</div>`;
        return;
      }

      refs.loginKey.value = state.adminKey;
      refs.logoutButton.classList.remove("hidden");

      const [configResponse, providersResponse] = await Promise.all([
        request("/admin/config", {}, true),
        request("/admin/providers", {}, true)
      ]);

      if (configResponse.status === 401 || providersResponse.status === 401) {
        setStoredAdminKey("");
        refs.adminWorkspace.classList.add("hidden");
        refs.logoutButton.classList.add("hidden");
        refs.providerList.innerHTML = `<div class="empty">${escapeHTML(t("admin.localKeyExpired"))}</div>`;
        setMessage(refs.loginStatus, t("admin.invalidKey"), "error");
        return;
      }

      if (!configResponse.ok) {
        throw new Error(await parseErrorMessage(configResponse, t("error.readGlobal")));
      }
      if (!providersResponse.ok) {
        throw new Error(await parseErrorMessage(providersResponse, t("error.readProviders")));
      }

      const globalConfig = await configResponse.json();
      const providers = await providersResponse.json();
      state.providers = providers;

      refs.globalAdminKey.value = globalConfig.admin_key || "";
      refs.globalTokenEstimation.checked = Boolean(globalConfig.token_estimation_enabled);
      refs.globalClientKeys.value = (globalConfig.client_keys || []).join("\n");
      refs.adminWorkspace.classList.remove("hidden");
      setMessage(refs.adminActionStatus, "", "");
      renderProviders(providers);
    }

    function providerTypeOptions(selected) {
      const options = [
        ["openai_chat", "OpenAI Chat"],
        ["openai_responses", "OpenAI Responses"],
        ["claude", "Claude"],
        ["gemini", "Gemini"]
      ];
      return options.map(([value, label]) => `<option value="${value}" ${selected === value ? "selected" : ""}>${label}</option>`).join("");
    }

    function providerStrategyOptions(selected) {
      const options = [
        ["round_robin", t("strategy.roundRobin")],
        ["fill", t("strategy.fill")]
      ];
      return options.map(([value, label]) => `<option value="${value}" ${selected === value ? "selected" : ""}>${label}</option>`).join("");
    }

    function renderProviders(providers) {
      if (!providers.length) {
        refs.providerList.innerHTML = `<div class="empty">${escapeHTML(t("provider.empty"))}</div>`;
        return;
      }

      refs.providerList.innerHTML = providers.map((provider) => {
        const stats = state.stats[provider.name] || {};
        const keys = provider.keys || [];
        const keySummary = summarizeProviderKeys(keys);
        const keyHTML = keys.length
          ? `<div class="key-list">${keys.map((key) => {
              const isDisabled = Number(key.disabled_until || 0) * 1000 > Date.now();
              const stateText = isDisabled
                ? t("provider.disabledUntil", { time: formatTimestamp(key.disabled_until) })
                : t("provider.usable");
              return `
                <div class="key-item">
                  <div>
                    <code>${escapeHTML(key.value)}</code>
                    <div class="provider-meta">${escapeHTML(t("provider.fails", { n: key.consecutive_fails || 0 }))} · ${escapeHTML(stateText)}</div>
                  </div>
                  <button class="secondary" type="button" data-action="delete-key" data-provider="${escapeHTML(provider.name)}" data-key="${escapeHTML(key.value)}">${escapeHTML(t("provider.delete"))}</button>
                </div>
              `;
            }).join("")}</div>`
          : `<div class="empty">${escapeHTML(t("provider.noKeys"))}</div>`;

        return `
          <article class="provider-card">
            <div class="provider-head">
              <div>
                <h3 class="provider-name">${escapeHTML(provider.name)}</h3>
                <div class="provider-meta">${escapeHTML(provider.type)} · ${escapeHTML(provider.base_url || t("provider.defaultUpstream"))}</div>
                <div class="tag-row">
                  <span class="tag ok">${escapeHTML(t("provider.tagSuccess", { n: stats.success_count || 0 }))}</span>
                  <span class="tag err">${escapeHTML(t("provider.tagError", { n: stats.error_count || 0 }))}</span>
                  <span class="tag muted">${escapeHTML(t("provider.tagCacheHits", { n: stats.cache_hits || 0 }))}</span>
                  <span class="tag">${escapeHTML(t("provider.tagKeys", { n: keys.length }))}</span>
                  <span class="tag ok">${escapeHTML(t("provider.tagAvailable", { n: keySummary.available }))}</span>
                  <span class="tag err">${escapeHTML(t("provider.tagDisabled", { n: keySummary.disabled }))}</span>
                  <span class="tag ${provider.cache_enabled ? "ok" : "muted"}">${escapeHTML(t(provider.cache_enabled ? "provider.tagCacheOn" : "provider.tagCacheOff"))}</span>
                </div>
              </div>
              <button class="secondary" type="button" data-action="delete-provider" data-provider="${escapeHTML(provider.name)}">${escapeHTML(t("provider.delete"))}</button>
            </div>

            <hr class="divider">

            <form class="provider-edit-form" data-provider="${escapeHTML(provider.name)}">
              <div class="form-grid">
                <label>
                  ${escapeHTML(t("provider.name"))}
                  <input name="name" type="text" value="${escapeHTML(provider.name)}" readonly>
                </label>
                <label>
                  ${escapeHTML(t("provider.type"))}
                  <select name="type">${providerTypeOptions(provider.type)}</select>
                </label>
              </div>
              <div class="form-grid">
                <label>
                  ${escapeHTML(t("provider.baseUrl"))}
                  <input name="base_url" type="text" value="${escapeHTML(provider.base_url || "")}">
                </label>
                <label>
                  ${escapeHTML(t("provider.strategy"))}
                  <select name="key_strategy">${providerStrategyOptions(provider.key_strategy)}</select>
                </label>
              </div>
              <div class="form-grid three">
                <label>
                  ${escapeHTML(t("provider.failThreshold"))}
                  <input name="fail_threshold" type="number" min="1" value="${Number(provider.fail_threshold || 3)}">
                </label>
                <label>
                  ${escapeHTML(t("provider.minDisable"))}
                  <input name="min_disable_secs" type="number" min="1" value="${Number(provider.min_disable_secs || 30)}">
                </label>
                <label>
                  ${escapeHTML(t("provider.maxDisable"))}
                  <input name="max_disable_secs" type="number" min="1" value="${Number(provider.max_disable_secs || 3600)}">
                </label>
              </div>
              <div class="form-grid">
                <label class="checkbox">
                  <input name="cache_enabled" type="checkbox" ${provider.cache_enabled ? "checked" : ""}>
                  <span>${escapeHTML(t("provider.cacheEnabled"))}</span>
                </label>
                <label>
                  ${escapeHTML(t("provider.cacheMax"))}
                  <input name="cache_max_entries" type="number" min="1" value="${Number(provider.cache_max_entries || 1000)}">
                </label>
              </div>
              <div class="actions">
                <button class="primary" type="submit">${escapeHTML(t("provider.save"))}</button>
                <button class="secondary" type="button" data-action="clear-cache" data-provider="${escapeHTML(provider.name)}">${escapeHTML(t("provider.clearCache"))}</button>
              </div>
              <div class="inline-status" data-role="provider-status"></div>
            </form>

            <hr class="divider">

            <h3>${escapeHTML(t("provider.upstreamKeys"))}</h3>
            <form class="provider-keys-form" data-provider="${escapeHTML(provider.name)}">
              <label>
                ${escapeHTML(t("provider.batchImport"))}
                <textarea name="keys" placeholder="${escapeHTML(t("admin.keysPlaceholder"))}"></textarea>
              </label>
              <div class="actions">
                <button class="primary" type="submit">${escapeHTML(t("provider.import"))}</button>
              </div>
              <div class="inline-status" data-role="keys-status"></div>
            </form>
            ${keyHTML}
          </article>
        `;
      }).join("");
    }

    function readProviderPayload(form) {
      const formData = new FormData(form);
      return {
        name: String(formData.get("name") || "").trim(),
        type: String(formData.get("type") || "").trim(),
        base_url: String(formData.get("base_url") || "").trim(),
        key_strategy: String(formData.get("key_strategy") || "").trim(),
        fail_threshold: Number(formData.get("fail_threshold") || 3),
        min_disable_secs: Number(formData.get("min_disable_secs") || 30),
        max_disable_secs: Number(formData.get("max_disable_secs") || 3600),
        cache_enabled: form.querySelector('[name="cache_enabled"]').checked,
        cache_max_entries: Number(formData.get("cache_max_entries") || 1000)
      };
    }

    async function saveProvider(form, statusElement) {
      const payload = readProviderPayload(form);
      const response = await request("/admin/providers", {
        method: "POST",
        body: JSON.stringify(payload)
      }, true);

      if (!response.ok) {
        throw new Error(await parseErrorMessage(response, t("error.save")));
      }

      if (form === refs.createForm) {
        form.reset();
        form.querySelector('[name="fail_threshold"]').value = 3;
        form.querySelector('[name="min_disable_secs"]').value = 30;
        form.querySelector('[name="max_disable_secs"]').value = 3600;
        form.querySelector('[name="cache_max_entries"]').value = 1000;
      }

      setMessage(statusElement, t("admin.savedTip"), "ok");
      setMessage(refs.adminActionStatus, t("admin.savedProvider", { name: payload.name }), "ok");
      await loadAdminData();
      await loadStatus();
    }

    async function saveGlobalConfig() {
      const payload = {
        admin_key: refs.globalAdminKey.value.trim(),
        token_estimation_enabled: refs.globalTokenEstimation.checked,
        client_keys: refs.globalClientKeys.value
          .split(/\r?\n|,/)
          .map((item) => item.trim())
          .filter(Boolean)
      };

      const response = await request("/admin/config", {
        method: "PUT",
        body: JSON.stringify(payload)
      }, true);

      if (!response.ok) {
        throw new Error(await parseErrorMessage(response, t("error.save")));
      }

      if (payload.admin_key && payload.admin_key !== state.adminKey) {
        setStoredAdminKey(payload.admin_key);
        refs.loginKey.value = payload.admin_key;
      }
      setMessage(refs.globalStatus, t("admin.savedTip"), "ok");
      setMessage(refs.adminActionStatus, t("admin.savedGlobal"), "ok");
      await loadStatus();
    }

    async function importKeys(form, statusElement) {
      const provider = form.dataset.provider;
      const formData = new FormData(form);
      const response = await request(`/admin/providers/${encodeURIComponent(provider)}/keys`, {
        method: "POST",
        body: JSON.stringify({ keys: String(formData.get("keys") || "") })
      }, true);

      if (!response.ok) {
        throw new Error(await parseErrorMessage(response, t("error.import")));
      }

      form.reset();
      setMessage(statusElement, t("admin.importDone"), "ok");
      setMessage(refs.adminActionStatus, t("admin.importDoneTip", { provider }), "ok");
      await loadAdminData();
      await loadStatus();
    }

    async function deleteProvider(name) {
      const response = await request(`/admin/providers/${encodeURIComponent(name)}`, {
        method: "DELETE"
      }, true);
      if (!response.ok) {
        throw new Error(await parseErrorMessage(response, t("error.delete")));
      }
      setMessage(refs.adminActionStatus, t("admin.deletedProvider", { name }), "ok");
      await loadAdminData();
      await loadStatus();
    }

    async function deleteKey(provider, key) {
      const response = await request(`/admin/providers/${encodeURIComponent(provider)}/${encodeURIComponent(key)}`, {
        method: "DELETE"
      }, true);
      if (!response.ok) {
        throw new Error(await parseErrorMessage(response, t("error.delete")));
      }
      setMessage(refs.adminActionStatus, t("admin.deletedKey", { provider }), "ok");
      await loadAdminData();
      await loadStatus();
    }

    async function clearProviderCache(provider) {
      const response = await request(`/admin/providers/${encodeURIComponent(provider)}/cache`, {
        method: "DELETE"
      }, true);
      if (!response.ok) {
        throw new Error(await parseErrorMessage(response, t("error.action")));
      }
      setMessage(refs.adminActionStatus, t("admin.clearedCache", { provider }), "ok");
      await loadAdminData();
      await loadStatus();
    }

    /* ---------- listeners ---------- */

    refs.navStatus.addEventListener("click", () => goTo("/status"));
    refs.navAdmin.addEventListener("click", () => goTo("/admin"));

    refs.themeToggle.addEventListener("click", () => {
      setTheme(state.theme === "dark" ? "light" : "dark");
    });

    refs.langToggle.addEventListener("click", () => {
      setLang(state.lang === "zh-CN" ? "en" : "zh-CN");
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        void loadStatus();
      }
    });

    // Follow system theme until user manually overrides
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (event) => {
        if (!state.themeManual) {
          state.theme = event.matches ? "dark" : "light";
          applyTheme();
        }
      });
    }

    refs.loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const adminKey = refs.loginKey.value.trim();
      if (!adminKey) {
        setMessage(refs.loginStatus, t("admin.pleaseInputKey"), "error");
        return;
      }

      try {
        await loginAdmin(adminKey);
        await loadAdminData();
      } catch (error) {
        setMessage(refs.loginStatus, error.message || t("error.login"), "error");
      }
    });

    refs.logoutButton.addEventListener("click", () => {
      setStoredAdminKey("");
      refs.loginKey.value = "";
      refs.adminWorkspace.classList.add("hidden");
      refs.providerList.innerHTML = `<div class="empty">${escapeHTML(t("admin.loggedOut"))}</div>`;
      refs.logoutButton.classList.add("hidden");
      setMessage(refs.adminActionStatus, "", "");
      setMessage(refs.loginStatus, t("admin.loggedOutMsg"), "ok");
    });

    refs.globalForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        await saveGlobalConfig();
      } catch (error) {
        setMessage(refs.globalStatus, error.message || t("error.save"), "error");
      }
    });

    refs.createForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        await saveProvider(refs.createForm, refs.createStatus);
      } catch (error) {
        setMessage(refs.createStatus, error.message || t("error.save"), "error");
      }
    });

    refs.providerList.addEventListener("submit", async (event) => {
      const form = event.target;
      if (!(form instanceof HTMLFormElement)) {
        return;
      }

      event.preventDefault();

      try {
        if (form.classList.contains("provider-edit-form")) {
          const statusElement = form.querySelector('[data-role="provider-status"]');
          await saveProvider(form, statusElement);
        }
        if (form.classList.contains("provider-keys-form")) {
          const statusElement = form.querySelector('[data-role="keys-status"]');
          await importKeys(form, statusElement);
        }
      } catch (error) {
        const role = form.classList.contains("provider-edit-form") ? "provider-status" : "keys-status";
        const statusElement = form.querySelector(`[data-role="${role}"]`);
        setMessage(statusElement, error.message || t("error.action"), "error");
      }
    });

    refs.providerList.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) {
        return;
      }

      const action = button.dataset.action;
      const provider = button.dataset.provider;
      const key = button.dataset.key;

      try {
        if (action === "delete-provider") {
          await deleteProvider(provider);
        }
        if (action === "delete-key") {
          await deleteKey(provider, key);
        }
        if (action === "clear-cache") {
          await clearProviderCache(provider);
        }
      } catch (error) {
        setMessage(refs.adminActionStatus, error.message || t("error.action"), "error");
      }
    });

    async function init() {
      applyTheme();
      applyI18nStatic();
      setRouteView();
      startStatusPolling();
      await loadHealth();
      await loadStatus();

      if (route === "admin") {
        if (state.adminKey) {
          refs.loginKey.value = state.adminKey;
          setMessage(refs.loginStatus, t("admin.localKeyLoaded"), "ok");
        }
        try {
          await loadAdminData();
        } catch (error) {
          setMessage(refs.loginStatus, error.message || t("error.read"), "error");
        }
      }
    }

    init();
  </script>
</body>
</html>
