services:
  app:
    container_name: simple-api-pool
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ADMIN_KEY: ${ADMIN_KEY:?请先在 .env 中设置 ADMIN_KEY}
      CLIENT_KEYS: ${CLIENT_KEYS:-}
      PORT: ${PORT:-18080}
      GOMEMLIMIT: ${GOMEMLIMIT:-32MiB}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-}
    ports:
      - "${PORT:-18080}:${PORT:-18080}"
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
