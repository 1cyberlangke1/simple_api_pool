name: Publish GHCR Image

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本号，示例 1.0.0 或 v1.0.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 计算镜像信息
        id: vars
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$version" ]; then
            version="${{ github.ref_name }}"
          fi
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "未提供有效版本号" >&2
            exit 1
          fi

          IFS='.' read -r major minor patch <<EOF
          $version
          EOF
          if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
            echo "版本号必须是 x.y.z 或 vx.y.z" >&2
            exit 1
          fi

          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          revision_short="$(git rev-parse --short=7 "$GITHUB_SHA")"
          build_date="$(git show -s --format=%cs "$GITHUB_SHA")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
          echo "revision_short=$revision_short" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/${repo}" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=${{ steps.vars.outputs.major }}.${{ steps.vars.outputs.minor }}
            type=raw,value=${{ steps.vars.outputs.major }}
            type=raw,value=latest

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
            APP_REVISION=${{ steps.vars.outputs.revision_short }}
            APP_BUILD_TIME=${{ steps.vars.outputs.build_date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
