name: Go Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SLOW_FRONTEND_BUILD_PATTERN: '^(TestFrontendBuildFailsWhenTemplateReferencesMissingGeneratedAsset|TestFrontendBuildFailsWhenGeneratedOutputRetainsBuildPlaceholder|TestFrontendBuildWritesManifestWithDetectedLayoutAndAssets|TestFrontendBuildRemovesStaleGeneratedAssets|TestFrontendBuildChangesAssetVersionWhenBuildTimeChanges)$'
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: 运行检查脚本
        shell: bash
        run: bash scripts/check.sh

      - name: 输出覆盖率摘要
        working-directory: src/backend
        shell: bash
        run: |
          go test ./tests -count=1 -skip "$SLOW_FRONTEND_BUILD_PATTERN" -coverpkg='./adminapi,./app,./auth,./cache,./config,./keyring,./providerapi,./proxyapi,./stats,./store,./token,./webui' -coverprofile=coverage_profile
          go tool cover -func=coverage_profile

      - name: 校验覆盖率下限
        working-directory: src/backend
        shell: bash
        run: |
          total_line=$(go tool cover -func=coverage_profile | tail -n 1)
          if [ -z "$total_line" ]; then
            echo '未找到覆盖率汇总' >&2
            exit 1
          fi
          value=$(printf '%s\n' "$total_line" | awk '{gsub("%", "", $3); print $3}')
          awk -v current="$value" 'BEGIN { if (current + 0 < 80) exit 1 }' || {
            echo "覆盖率不足 80%，当前为 ${value}%" >&2
            exit 1
          }
          echo "覆盖率达标：${value}%"
