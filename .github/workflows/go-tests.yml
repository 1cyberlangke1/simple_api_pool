name: Go Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum

      - name: 运行基础测试
        run: go test ./...

      - name: 输出覆盖率摘要
        run: |
          go test ./tests -coverpkg='./adminapi,./app,./auth,./cache,./config,./keyring,./providerapi,./proxyapi,./stats,./store,./token,./webui' -coverprofile=coverage_profile
          go tool cover -func=coverage_profile

      - name: 校验覆盖率下限
        run: |
          total_line=$(go tool cover -func=coverage_profile | tail -n 1)
          if [ -z "$total_line" ]; then
            echo '未找到覆盖率汇总' >&2
            exit 1
          fi
          value=$(printf '%s\n' "$total_line" | awk '{gsub("%", "", $3); print $3}')
          awk -v current="$value" 'BEGIN { if (current + 0 < 80) exit 1 }' || {
            echo "覆盖率不足 80%，当前为 ${value}%" >&2
            exit 1
          }
          echo "覆盖率达标：${value}%"

      - name: 运行 race 测试
        run: go test -race ./tests
